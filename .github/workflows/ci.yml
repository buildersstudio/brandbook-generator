name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # No install step: the renderer has zero dependencies and the tests run on
      # node:test. If this ever needs `npm ci`, the tool stopped being clone-and-run.
      - run: npm test
